name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  back-end:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: back-end } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: back-end/package-lock.json }
      - run: npm ci
      - run: npx prisma generate
      - run: npm test

  front-end:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: front-end } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: front-end/package-lock.json }
      - run: npm ci
      - run: npm run check
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
        env: { JWT_SECRET: ci-only-secret-with-more-than-32-characters }
